<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>CarForge | Home</title>
        <script src="/static/scripts/JQuery.js"></script>
        <link rel="stylesheet" href="/static/styles/Index.css">
        <link rel="stylesheet" href="/static/styles/Header.css">
    </head>
    <body>
        <header id="header">
            <a class="menuItem left" href="https://plate.forgeware.de">Kennzeichen verstecken</a>
            {% if "read.test" in session["user"]["roles"] %}
                <a class="menuItem left" href="/test">Test</a>
            {% endif %}
            {% if not session.get("user") == None %}
                <details class="account-menu">
                    <summary class="menuItem right">
                        <span class="menuLabel">{{session.get("user").get("username")}}</span>
                        <span class="menuChevron" aria-hidden="true"></span>
                    </summary>
                    <div class="submenu">
                        <a href="/settings">Settings</a>
                        <form method="post" action="/auth/logout">
                            <button type="submit">Logout</button>
                        </form>
                    </div>
                </details>
            {% else %}
                <a class="menuItem" href="/auth/login">Anmelden</a>
            {% endif %}
        </header>
        <main id="content">{% block content %}{% endblock %}</main>
        <footer id="site-footer">
            <nav aria-label="Rechtliche Informationen">
                <a href="/impressum">Impressum</a>
                <span aria-hidden="true">&bull;</span>
                <a href="/datenschutz">Datenschutz</a>
            </nav>
            <small>Version {{ app_version }}</small>
        </footer>
    </body>
</html>
